<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening ZB202 Digital Twin</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sensor = String(params.get("deviceId") || "AM103_07").replaceAll("_", "-");
    const lang = params.get("lang");
    window.location.replace(`twin.html${lang ? `?lang=${encodeURIComponent(lang)}` : ""}#sensor=${encodeURIComponent(sensor)}`);
  </script>
</head>
<body></body>
</html>

<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ZB202 AI-Empowered Digital Twin Platform" />
  <title>ZB202 Digital Twin</title>
  <script>
    (() => {
      let theme = null, transparency = null;
      try { theme = localStorage.getItem("zb202-theme"); transparency = localStorage.getItem("zb202-transparency"); } catch { /* optional */ }
      const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      const root = document.documentElement;
      root.dataset.theme = dark ? "dark" : "light";
      root.dataset.transparency = transparency || (matchMedia("(prefers-reduced-transparency: reduce)").matches ? "reduced" : "standard");
      const kiosk = innerWidth >= 1920 || (new URLSearchParams(location.search).get("kiosk") === "1" && innerWidth >= 1600);
      root.dataset.tier = kiosk ? "kiosk" : innerWidth < 1280 ? "narrow" : "standard";
      if (matchMedia("(orientation: portrait) and (max-width: 760px)").matches) root.dataset.phone = "";
      root.dataset.touch = String(matchMedia("(pointer: coarse)").matches || matchMedia("(hover: none)").matches);
    })();
  </script>
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="src/twin/styles/index.css" />
</head>
<body class="tw" data-view="home" data-phase="loading">
  <div class="tw-sky" aria-hidden="true"></div>

  <main class="tw-stage" id="stage" aria-label="ZB202 三维数字孪生" data-i18n-aria="viewerAria">
    <canvas id="twin-canvas"></canvas>
    <div class="tw-marker-layer" id="marker-layer" aria-hidden="true"></div>
    <div class="tw-flash" id="flash" aria-hidden="true"></div>
  </main>

  <section class="tw-intro" id="intro" role="status" aria-live="polite">
    <p class="tw-intro-status"><span id="intro-text" data-i18n="introLoading">正在载入 BIM 模型</span> <b id="intro-percent">0%</b></p>
    <div class="tw-intro-bar" aria-hidden="true"><i id="intro-bar"></i></div>
    <p class="tw-intro-skip" id="intro-skip" data-i18n="introSkip" hidden>点击或按任意键跳过</p>
    <div class="tw-intro-error glass-thick" id="intro-error" role="alert" hidden>
      <i class="ph ph-warning-circle" aria-hidden="true"></i>
      <div><strong data-i18n="loadFailed">模型加载失败</strong><p data-i18n="loadRetryHint"></p></div>
      <button type="button" class="tw-button" id="reload-btn" data-i18n="reload">重新加载</button>
    </div>
  </section>

  <header class="tw-top">
    <section class="tw-identity glass-thin" id="identity" aria-label="ZB202">
      <div class="tw-identity-row">
        <h1 class="tw-room">ZB202</h1>
        <span class="tw-live" id="live-status"><i aria-hidden="true"></i><span></span></span>
      </div>
      <p class="tw-identity-sub" data-i18n="appTitle">ZB202 AI 赋能数字孪生平台</p>
      <p class="tw-identity-meta"><span id="outdoor-line"></span><time id="hk-clock"></time></p>
      <p class="tw-identity-stats" id="stats-line" hidden></p>
    </section>

    <section class="tw-center" id="center">
      <div class="tw-badges" id="badges" aria-live="polite"></div>
      <div class="tw-capsules" id="capsules" role="list"></div>
      <p class="tw-sentence" id="sentence" aria-live="polite"></p>
    </section>

    <section class="tw-actions">
      <button type="button" class="tw-alarm-capsule glass-thin" id="alarm-capsule" aria-haspopup="dialog" aria-expanded="false">
        <i class="tw-alarm-dot" aria-hidden="true"></i><span id="alarm-text"></span>
      </button>
      <div class="tw-segmented glass-thin" id="lang-switch" role="radiogroup" aria-label="语言" data-i18n-aria="languageAria">
        <span class="tw-seg-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-lang="zh" lang="zh-Hans">简</button>
        <button type="button" role="radio" data-lang="zh-Hant" lang="zh-Hant">繁</button>
        <button type="button" role="radio" data-lang="en" lang="en">EN</button>
      </div>
      <div class="tw-toolgroup glass-thin" role="group" aria-label="工具" data-i18n-aria="toolsAria">
        <button type="button" class="tw-icon-button" id="snapshot-btn" data-i18n-aria="snapshot" data-i18n-title="snapshot"><i class="ph ph-camera" aria-hidden="true"></i></button>
        <button type="button" class="tw-icon-button" id="settings-btn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="settings" data-i18n-title="settings"><i class="ph ph-gear-six" aria-hidden="true"></i></button>
      </div>
    </section>
  </header>

  <aside class="tw-dock tw-dock-left" id="dock-left">
    <article class="tw-ai-card glass-thick" id="ai-card" tabindex="0" role="button" aria-label="AI"></article>
    <section class="tw-card glass-thick" id="indoor-card" aria-labelledby="indoor-card-title" data-home></section>
    <section class="tw-card glass-thick" id="outdoor-card" aria-labelledby="outdoor-card-title" data-home hidden></section>
  </aside>
  <aside class="tw-dock tw-dock-right" id="dock-right">
    <section class="tw-card glass-thick" id="alarm-card" aria-labelledby="alarm-card-title" data-home></section>
    <section class="tw-card glass-thick" id="socket-card" aria-labelledby="socket-card-title" data-home hidden></section>
  </aside>

  <aside class="tw-panel glass-thick" id="theme-panel" aria-labelledby="panel-title" hidden>
    <header class="tw-panel-head">
      <span class="tw-sheet-grip" aria-hidden="true"></span>
      <h2 id="panel-title"></h2>
      <button type="button" class="tw-icon-button tw-close" id="panel-close" data-i18n-aria="close"><i class="ph ph-x" aria-hidden="true"></i></button>
    </header>
    <div class="tw-panel-body" id="panel-body"></div>
  </aside>

  <aside class="tw-panel tw-sheet glass-thick" id="sensor-sheet" aria-labelledby="sheet-title" hidden>
    <header class="tw-panel-head">
      <span class="tw-sheet-grip" aria-hidden="true"></span>
      <h2 id="sheet-title"></h2>
      <button type="button" class="tw-icon-button tw-close" id="sheet-close" data-i18n-aria="close"><i class="ph ph-x" aria-hidden="true"></i></button>
    </header>
    <div class="tw-panel-body" id="sheet-body"></div>
  </aside>

  <section class="tw-replay-bar glass-thick" id="replay-bar" hidden></section>

  <button type="button" class="tw-reset-view glass-thin" id="reset-view" hidden><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i><span data-i18n="resetView">回到默认视角</span></button>

  <nav class="tw-tabbar glass-thin" id="tabbar" role="tablist" aria-label="主要功能" data-i18n-aria="tabsAria">
    <span class="tw-tab-thumb" aria-hidden="true"></span>
    <button type="button" role="tab" class="tw-tab" data-view="home"><i class="ph ph-squares-four" aria-hidden="true"></i><span data-i18n="tabHome">总览</span></button>
    <button type="button" role="tab" class="tw-tab" data-view="environment"><i class="ph ph-thermometer-simple" aria-hidden="true"></i><span data-i18n="tabEnvironment">环境</span></button>
    <button type="button" role="tab" class="tw-tab" data-view="energy"><i class="ph ph-lightning" aria-hidden="true"></i><span data-i18n="tabEnergy">用电</span></button>
    <button type="button" role="tab" class="tw-tab" data-view="devices"><i class="ph ph-cpu" aria-hidden="true"></i><span data-i18n="tabDevices">设备</span></button>
    <button type="button" role="tab" class="tw-tab" data-view="ai"><i class="ph ph-sparkle" aria-hidden="true"></i><span data-i18n="tabAi">AI</span></button>
  </nav>

  <div class="tw-kiosk-hint glass-thin" id="kiosk-hint" hidden><i class="ph ph-hand-tap" aria-hidden="true"></i><span data-i18n="kioskHint"></span></div>
  <div class="tw-banner glass-thick" id="alarm-banner" role="alert" hidden></div>
  <div class="tw-popover glass-thick" id="alarm-popover" role="dialog" aria-labelledby="alarm-popover-title" hidden></div>
  <div class="tw-popover glass-thick" id="settings-menu" role="menu" hidden></div>
  <div class="tw-popover tw-confirm glass-thick" id="confirm-popover" role="alertdialog" hidden></div>
  <div class="tw-popover glass-thick" id="qr-popover" role="dialog" hidden></div>
  <section class="tw-print-host" id="print-report" aria-hidden="true"></section>
  <div class="tw-popover tw-glossary glass-thick" id="glossary-tip" role="tooltip" hidden></div>
  <div class="tw-chart-tip glass-thick" id="chart-tip" role="tooltip" hidden></div>
  <div class="tw-toast glass-thin" id="toast" role="status" aria-live="polite" hidden></div>
  <img class="tw-snapshot-thumb" id="snapshot-thumb" alt="" hidden />

  <section class="tw-ai-page" id="ai-page" role="dialog" aria-modal="true" aria-labelledby="ai-page-title" hidden></section>

  <aside class="tw-hud" id="hud" hidden></aside>
  <div class="tw-coordinate glass-thin" id="coordinate" hidden><span id="coordinate-value"></span><button type="button" class="tw-button tw-button-small" id="coordinate-copy" data-i18n="copy">复制</button></div>

  <section class="tw-mobile" id="mobile-view" aria-label="ZB202" hidden></section>
  <script type="module" src="src/twin/app.js"></script>
</body>
</html>

# Public read-only data bridge for the Vercel frontend.
# Create it in Render with New > Blueprint, then enter ZB202_INFLUX_TOKEN when prompted.
services:
  - type: web
    name: zb202-bridge
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run influx:bridge
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ZB202_BRIDGE_READ_ONLY
        value: "true"
      - key: ZB202_BRIDGE_ALLOWED_ORIGINS
        value: https://zb202-digital-twin.vercel.app
      - key: ZB202_INFLUX_URL
        value: http://influxdb.itf.beeerise.com
      - key: ZB202_INFLUX_ORG
        value: PolyU
      - key: ZB202_INFLUX_BUCKET
        value: zb202_iot
      - key: ZB202_INFLUX_DEVICE_COLUMN
        value: devEui
      - key: ZB202_INFLUX_TOKEN
        sync: false

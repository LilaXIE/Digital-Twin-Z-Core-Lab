# Public data bridge for the Vercel frontend.
# Create it in Render with New > Blueprint, then enter the secrets marked sync: false when prompted.
# Control commands (sockets, meetings, mode) need ZB202_BRIDGE_WRITE_KEY; set ZB202_BRIDGE_READ_ONLY=true to refuse them all.
services:
  - type: web
    name: zb202-bridge
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run influx:bridge
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ZB202_BRIDGE_READ_ONLY
        value: "false"
      - key: ZB202_BRIDGE_REQUIRE_KEY
        value: "true"
      - key: ZB202_BRIDGE_ALLOWED_ORIGINS
        value: https://zb202-digital-twin.vercel.app
      - key: ZB202_INFLUX_URL
        value: http://influxdb.itf.beeerise.com
      - key: ZB202_INFLUX_ORG
        value: PolyU
      - key: ZB202_INFLUX_BUCKET
        value: zb202_iot
      - key: ZB202_INFLUX_DEVICE_COLUMN
        value: devEui
      - key: ZB202_MQTT_URL
        value: mqtt://itf.beeerise.com:1889
      - key: ZB202_INFLUX_TOKEN
        sync: false
      - key: ZB202_BRIDGE_WRITE_KEY
        sync: false
      - key: ZB202_MQTT_USERNAME
        sync: false
      - key: ZB202_MQTT_PASSWORD
        sync: false
